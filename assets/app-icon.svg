  <!-- Writan: a W made of three blue sheets of paper on a dark tile (the brand board's mark,
       Logo in src/components/ui.tsx). The tile sits on Apple's 824 px icon grid. Source for every
       icon size: `npx tauri icon assets/app-icon.svg -o /tmp/icons` (see docs/internals/development.md). -->
  <defs>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(4.12)">
    <rect width="200" height="200" rx="45" fill="#1C1C1C" filter="url(#iconShadow)"/>
    <g transform="translate(100 102) scale(1.12) translate(-100 -102)" stroke-linejoin="round">
      <path d="M45 56 H67 L93 148 H71 Z" fill="#7FAAFF" stroke="#7FAAFF" stroke-width="4"/>
      <path d="M133 56 H155 L129 148 H107 Z" fill="#2F66D8" stroke="#2F66D8" stroke-width="4"/>
