      <path d="M71 148 L89 88 H100 V124.7 L93 148 Z" fill="#4F8CFF" stroke="#4F8CFF" stroke-width="3"/>
      <path d="M100 88 H111 L129 148 H107 L100 124.7 Z" fill="#3B74EA" stroke="#3B74EA" stroke-width="3"/>
    </g>
    <rect x="0.25" y="0.25" width="199.5" height="199.5" rx="44.75" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.5"/>
