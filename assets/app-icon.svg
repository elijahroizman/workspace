<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Workspace: three documents fanned like a hand of cards, in the colors the app gives
       PowerPoint (orange), Word (blue) and PDF (red). Source for every icon size:
       `npx tauri icon assets/app-icon.svg -o src-tauri/icons` (see docs/internals/development.md). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa261"/>
      <stop offset="1" stop-color="#f2702a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa2ff"/>
      <stop offset="1" stop-color="#3a72f0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceef4"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05060c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <g transform="translate(0 30)">
  <!-- Each card turns about the same point below the icon, so they fan out from one corner. -->
  <g filter="url(#card)">
    <g transform="rotate(-17 512 900)">
      <rect x="337" y="250" width="350" height="450" rx="44" fill="url(#orange)"/>
      <rect x="389" y="318" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="389" y="380" width="246" height="150" rx="20" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>
  <g filter="url(#card)">
    <g transform="rotate(17 512 900)">
      <rect x="337" y="250" width="350" height="450" rx="44" fill="url(#blue)"/>
      <rect x="389" y="318" width="186" height="26" rx="13" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="389" y="374" width="246" height="16" rx="8" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="389" y="410" width="220" height="16" rx="8" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="389" y="446" width="234" height="16" rx="8" fill="#ffffff" fill-opacity="0.45"/>
    </g>
  </g>
  <g filter="url(#card)">
    <!-- The front page, with its corner folded over in PDF red. -->
    <path d="M381 286 a44 44 0 0 1 44 -44 h200 l104 104 v350 a44 44 0 0 1 -44 44 h-260 a44 44 0 0 1 -44 -44 z" fill="url(#paper)"/>
  </g>
  <path d="M625 242 l104 104 h-68 a36 36 0 0 1 -36 -36 z" fill="#f2555a"/>
  <rect x="433" y="320" width="150" height="28" rx="14" fill="#23263a"/>
  <rect x="433" y="398" width="244" height="18" rx="9" fill="#c8cbd8"/>
  <rect x="433" y="438" width="214" height="18" rx="9" fill="#c8cbd8"/>
  <rect x="433" y="478" width="232" height="18" rx="9" fill="#c8cbd8"/>
  <rect x="433" y="518" width="180" height="18" rx="9" fill="#c8cbd8"/>
  <rect x="433" y="578" width="112" height="74" rx="14" fill="#4f8cff" fill-opacity="0.18"/>
  <rect x="565" y="586" width="112" height="16" rx="8" fill="#c8cbd8"/>
  <rect x="565" y="622" width="84" height="16" rx="8" fill="#c8cbd8"/>
  </g>
</svg>
