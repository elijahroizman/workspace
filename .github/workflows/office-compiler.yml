name: Office compiler

# Checks crates/ (the office compiler) on pull requests and on main. The app's own build doesn't
# use it yet, so nothing else runs these tests. See docs/internals/office-compiler.md.
on:
  pull_request:
    paths: ['crates/**', '.github/workflows/office-compiler.yml']
  push:
    branches: [main]
    paths: ['crates/**', '.github/workflows/office-compiler.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: crates

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The core works on bytes only, so the browser version can use it too.
      - run: cargo build -p office-core --target wasm32-unknown-unknown

  samples:
    name: Real files, and other apps opening ours
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: LibreOffice and the Python libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui
          python3 -m pip install --user --break-system-packages python-docx python-pptx openpyxl
      - run: python3 samples.py "$RUNNER_TEMP/samples"
      - run: cargo test --workspace --all-features
        env:
          OFFICE_SAMPLES: ${{ runner.temp }}/samples
      - run: cargo test --workspace --all-features -- --ignored
        env:
          OFFICE_SAMPLES: ${{ runner.temp }}/samples
