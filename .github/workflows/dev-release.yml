name: Dev release

# A Mac-only maintainer build of main, for trying a change before it goes into a full release.
# Run it from the Actions tab. macOS (Apple silicon) only.
#
# It builds "Workspace Dev" (its own app ID, see src-tauri/tauri.dev.conf.json, so it sits beside
# a normal install) as version <tauri.conf.json's version with the patch bumped>-dev.<run>, signs
# and notarizes it like a release, and attaches the .dmg to a pre-release tagged dev-<version>.
# A pre-release, so the updater and the app's "latest release" never pick it: it has no update
# bundle and doesn't touch latest.json or the APT and dnf repositories.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What to try in this build (the pre-release's notes)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  mac:
    name: macOS Apple silicon
    runs-on: macos-latest
    env:
      # The app doesn't check for updates (src/lib/updater.ts).
      VITE_DEV_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - name: Dev version
        run: |
          set -euo pipefail
          base="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          VERSION="$(node -p "const [a, b, c] = process.argv[1].split('-')[0].split('.').map(Number); [a, b, c + 1].join('.')" "$base")-dev.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION
          node -e '
            const fs = require("fs")
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"))
              j.version = process.env.VERSION
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n")
            }'
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          grep '^version' src-tauri/Cargo.toml
      - name: App Store Connect key
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY" > "$key_file"
          # The secret is the .p8 file. Accept a one-line copy with literal \n, or base64.
          if ! grep -q "PRIVATE KEY" "$key_file"; then
            perl -pe 's/\\n/\n/g' "$key_file" > "$key_file.expanded"
            if grep -q "PRIVATE KEY" "$key_file.expanded"; then
              mv "$key_file.expanded" "$key_file"
            elif base64 -D -i "$key_file" > "$key_file.decoded" 2>/dev/null && grep -q "PRIVATE KEY" "$key_file.decoded"; then
              mv "$key_file.decoded" "$key_file"
            else
              rm -f "$key_file" "$key_file.expanded" "$key_file.decoded"
              echo "APPLE_API_KEY is not a PEM private key. Paste the .p8 file, or its base64." >&2
              exit 1
            fi
          fi
          rm -f "$key_file.expanded" "$key_file.decoded"
          chmod 600 "$key_file"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.dev.conf.json
      - name: Check the app is signed and notarized
        run: |
          set -euo pipefail
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Workspace Dev.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime|Identifier)'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Notarize the disk image
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "expected one disk image, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          stapled=0
          for _ in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg"; then
              stapled=1
              break
            fi
            sleep 20
          done
          [ "$stapled" -eq 1 ]
          xcrun stapler validate "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          tag="dev-$VERSION"
          {
            echo "> **Maintainer build, not a release.** macOS (Apple silicon) only. It installs as **Workspace Dev**, with its own app ID, so it sits beside a normal Workspace and keeps its own settings and recents. Signed and notarized like a release."
            echo
            printf '%s\n' "$NOTES"
            echo
            echo "Built from [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on \`${GITHUB_REF_NAME}\`."
          } > "$RUNNER_TEMP/notes.md"
          # A spaceless asset name, like the release builds'.
          asset="$RUNNER_TEMP/Workspace-Dev_${VERSION}_aarch64.dmg"
          cp "$DMG" "$asset"
          gh release create "$tag" "$asset" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Workspace Dev $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
