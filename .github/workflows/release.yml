name: Release

# Builds the Windows (x64) installer, the macOS (Apple silicon) disk image, a Debian/Ubuntu
# (x64) .deb package and a Fedora (x64) .rpm, and attaches them to a GitHub Release. Push a tag like v0.4.0 to publish one. Running it
# from the Actions tab only builds (and signs and notarizes), unless "publish" is ticked.
# It also signs the update bundles and publishes latest.json, which installed copies check
# for updates (see plugins.updater in src-tauri/tauri.conf.json). The update bundles are only
# made here, via tauri.release.conf.json, because signing them needs the private key. The .deb
# and .rpm have no update bundle (Tauri's updater can't replace a package-managed install), so the Linux
# job leaves latest.json alone and publishes an APT and a dnf repository instead (see their steps below).
# The release notes are the version's section of CHANGELOG.md.
#
# The Mac app is signed with the Developer ID certificate in APPLE_CERTIFICATE and notarized
# with the App Store Connect API key (APPLE_API_KEY holds the .p8 file, APPLE_API_KEY_ID its
# ID, APPLE_API_ISSUER the issuer ID). tauri.release.conf.json clears the ad-hoc signing
# identity ("-") so the imported certificate is used, and turns on the hardened runtime.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release for the version in tauri.conf.json
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis --config src-tauri/tauri.release.conf.json
          - name: macOS Apple silicon
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          - name: Linux x64 (Debian, Ubuntu, Fedora)
            # The oldest runner with webkit2gtk-4.1, so the .deb installs on Ubuntu 22.04+ and Debian 12+.
            # The .rpm is built from the same binary and is for Fedora.
            os: ubuntu-22.04
            args: --bundles deb,rpm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf createrepo-c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          # The release body is this version's section of CHANGELOG.md: what the update panel
          # in the app shows. A version without one doesn't get released.
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          section="$(awk -v v="$version" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } } found' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version. Add one headed '## $version — <date>'." >&2
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n\n' "$section"
            echo "Earlier versions: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${version}/CHANGELOG.md). How to install: [README](https://github.com/${GITHUB_REPOSITORY}#install)."
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: App Store Connect key
        if: matrix.os == 'macos-latest'
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY" > "$key_file"
          # The secret is the .p8 file. Accept a one-line copy with literal \n, or base64.
          if ! grep -q "PRIVATE KEY" "$key_file"; then
            perl -pe 's/\\n/\n/g' "$key_file" > "$key_file.expanded"
            if grep -q "PRIVATE KEY" "$key_file.expanded"; then
              mv "$key_file.expanded" "$key_file"
            elif base64 -D -i "$key_file" > "$key_file.decoded" 2>/dev/null && grep -q "PRIVATE KEY" "$key_file.decoded"; then
              mv "$key_file.decoded" "$key_file"
            else
              rm -f "$key_file" "$key_file.expanded" "$key_file.decoded"
              echo "APPLE_API_KEY is not a PEM private key. Paste the .p8 file, or its base64." >&2
              exit 1
            fi
          fi
          rm -f "$key_file.expanded" "$key_file.decoded"
          chmod 600 "$key_file"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS only. Tauri imports the certificate into a temporary keychain and signs
          # with its identity, then notarizes and staples the app.
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && 'Developer ID Application' || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
        with:
          tagName: ${{ env.PUBLISH == 'true' && 'v__VERSION__' || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && 'Workspace v__VERSION__' || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # A .deb or .rpm has no update bundle, so only the Mac and Windows jobs write latest.json.
          uploadUpdaterJson: ${{ matrix.os != 'ubuntu-22.04' }}
          args: ${{ matrix.args }}
      - name: Publish the APT repository
        # A flat APT repository in the assets of the release tagged "apt" (a pre-release, so the
        # updater and the app's "latest release" never pick it). The .deb's postinst points
        # /etc/apt/sources.list.d/workspace.list there, signed-by the key it installs
        # (src-tauri/linux/workspace-archive-keyring.gpg; the private half is APT_SIGNING_KEY).
        # The new .deb goes up first, then the index, then the signed Release, so apt never sees
        # an index pointing at a file that isn't there yet.
        if: matrix.os == 'ubuntu-22.04' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "expected one .deb, found ${#debs[@]}"
            exit 1
          fi
          repo="$RUNNER_TEMP/apt"
          rm -rf "$repo"
          mkdir -p "$repo"
          cp "${debs[0]}" "$repo/"
          deb="$(basename "${debs[0]}")"
          cd "$repo"
          # Asset names can't hold a path, so the index names the file alone.
          apt-ftparchive packages . | sed 's|^Filename: \./|Filename: |' > Packages
          gzip -9kn Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Workspace \
            -o APT::FTPArchive::Release::Label=Workspace \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Description="Workspace (github.com/${GITHUB_REPOSITORY})" \
            release . > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" Release
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
          if ! gh release view apt -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create apt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "APT repository" \
              --notes "Workspace's APT repository for Debian and Ubuntu. The .deb adds it for you; nothing here needs downloading by hand."
          fi
          gh release upload apt -R "$GITHUB_REPOSITORY" "$deb" --clobber
          gh release upload apt -R "$GITHUB_REPOSITORY" Packages Packages.gz --clobber
          gh release upload apt -R "$GITHUB_REPOSITORY" Release Release.gpg InRelease --clobber
          # Keep the new .deb and the one before it, for anyone whose index is a step behind.
          old="$(gh release view apt -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -E '^Workspace_.*_amd64\.deb$' | grep -vxF "$deb" | sort -V | head -n -1 || true)"
          for name in $old; do
            gh release delete-asset apt "$name" -R "$GITHUB_REPOSITORY" --yes
          done
      - name: Publish the dnf repository
        # A dnf repository at https://github.com/<repo>/releases/download/rpm/, which src-tauri/linux/rpm-postinst
        # adds to /etc/yum.repos.d. dnf reads <baseurl>/repodata/… and the index points packages at
        # packages/…, and GitHub serves tags with a slash, so the metadata is the assets of the
        # pre-release tagged "rpm/repodata" and the .rpm files those of "rpm/packages". repomd.xml is
        # signed with the APT key (repo_gpgcheck); it lists the other files' checksums and they list
        # the packages', so the one signature covers the lot. Same order as APT: the .rpm first, then
        # the metadata files (named by hash), then repomd.xml and its signature.
        if: matrix.os == 'ubuntu-22.04' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "expected one .rpm, found ${#rpms[@]}"
            exit 1
          fi
          repo="$RUNNER_TEMP/dnf"
          rm -rf "$repo"
          mkdir -p "$repo/packages"
          cp "${rpms[0]}" "$repo/packages/"
          rpm="$(basename "${rpms[0]}")"
          cd "$repo"
          createrepo_c --no-database --general-compress-type=gz .
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign -o repodata/repomd.xml.asc repodata/repomd.xml
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
          for tag in rpm/packages rpm/repodata; do
            if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "dnf repository (${tag#rpm/})" \
                --notes "Part of Workspace's dnf repository for Fedora. The .rpm adds it for you; nothing here needs downloading by hand."
            fi
          done
          gh release upload rpm/packages -R "$GITHUB_REPOSITORY" "packages/$rpm" --clobber
          meta=(repodata/*.xml.gz)
          gh release upload rpm/repodata -R "$GITHUB_REPOSITORY" "${meta[@]}" --clobber
          gh release upload rpm/repodata -R "$GITHUB_REPOSITORY" repodata/repomd.xml repodata/repomd.xml.asc --clobber
          # Drop metadata the new repomd.xml doesn't name, and keep the new .rpm and the one before it.
          for name in $(gh release view rpm/repodata -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$name" in repomd.xml | repomd.xml.asc) continue ;; esac
            [ -e "repodata/$name" ] || gh release delete-asset rpm/repodata "$name" -R "$GITHUB_REPOSITORY" --yes
          done
          old="$(gh release view rpm/packages -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -E '\.rpm$' | grep -vxF "$rpm" | sort -V | head -n -1 || true)"
          for name in $old; do
            gh release delete-asset rpm/packages "$name" -R "$GITHUB_REPOSITORY" --yes
          done
      - name: Check the Mac app is signed and notarized
        if: matrix.os == 'macos-latest'
        run: |
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Workspace.app
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Notarize the disk image
        if: matrix.os == 'macos-latest'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "expected one disk image, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          # Tauri notarizes the .app, then builds and signs the .dmg without notarizing it.
          # Gatekeeper checks the downloaded disk image, so submit that too and replace the
          # asset the action already uploaded.
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER" \
            --wait
          stapled=0
          for _ in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg"; then
              stapled=1
              break
            fi
            sleep 20
          done
          [ "$stapled" -eq 1 ]
          xcrun stapler validate "$dmg"
          if [ "$PUBLISH" = "true" ]; then
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            gh release upload "v${version}" "$dmg" --clobber
          fi
