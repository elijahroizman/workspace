name: Release

# Builds the Windows (x64) installer and the macOS (Apple silicon) disk image and
# attaches both to a GitHub Release. Push a tag like v0.4.0 to publish one. Running it
# from the Actions tab only builds (and signs and notarizes), unless "publish" is ticked.
# It also signs the update bundles and publishes latest.json, which installed copies check
# for updates (see plugins.updater in src-tauri/tauri.conf.json). The update bundles are only
# made here, via tauri.release.conf.json, because signing them needs the private key.
#
# The Mac app is signed with the Developer ID certificate in APPLE_CERTIFICATE and notarized
# with the App Store Connect API key (APPLE_API_KEY holds the .p8 file, APPLE_API_KEY_ID its
# ID, APPLE_API_ISSUER the issuer ID). tauri.release.conf.json clears the ad-hoc signing
# identity ("-") so the imported certificate is used, and turns on the hardened runtime.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release for the version in tauri.conf.json
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis --config src-tauri/tauri.release.conf.json
          - name: macOS Apple silicon
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            changes="$(git log --no-merges --pretty='- %s' "${prev}..HEAD")"
          else
            changes="$(git log --no-merges --pretty='- %s' -n 20)"
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo '## Changes'
            echo
            printf '%s\n' "${changes:-- No commits since the previous release.}"
            cat <<'EOF'

          ## Install

          **Mac (Apple silicon):** download `Workspace_…_aarch64.dmg`, open it and drag Workspace to Applications.

          **Windows (x64):** download `Workspace_…_x64-setup.exe` and run it. Windows may show "Windows protected your PC" because the app isn't signed; click More info → Run anyway.

          Version 0.2.0 and later update themselves. The Update button at the top right checks for a new version, shows these notes, and installs it. Quitting the app also installs an update that has already been downloaded.
          EOF
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: App Store Connect key
        if: matrix.os == 'macos-latest'
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY" > "$key_file"
          # The secret is the .p8 file. Accept a one-line copy with literal \n, or base64.
          if ! grep -q "PRIVATE KEY" "$key_file"; then
            perl -pe 's/\\n/\n/g' "$key_file" > "$key_file.expanded"
            if grep -q "PRIVATE KEY" "$key_file.expanded"; then
              mv "$key_file.expanded" "$key_file"
            elif base64 -D -i "$key_file" > "$key_file.decoded" 2>/dev/null && grep -q "PRIVATE KEY" "$key_file.decoded"; then
              mv "$key_file.decoded" "$key_file"
            else
              rm -f "$key_file" "$key_file.expanded" "$key_file.decoded"
              echo "APPLE_API_KEY is not a PEM private key. Paste the .p8 file, or its base64." >&2
              exit 1
            fi
          fi
          rm -f "$key_file.expanded" "$key_file.decoded"
          chmod 600 "$key_file"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS only. Tauri imports the certificate into a temporary keychain and signs
          # with its identity, then notarizes and staples the app.
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && 'Developer ID Application' || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}
        with:
          tagName: ${{ env.PUBLISH == 'true' && 'v__VERSION__' || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && 'Workspace v__VERSION__' || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Check the Mac app is signed and notarized
        if: matrix.os == 'macos-latest'
        run: |
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Workspace.app
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - name: Notarize the disk image
        if: matrix.os == 'macos-latest'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "expected one disk image, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          # Tauri notarizes the .app, then builds and signs the .dmg without notarizing it.
          # Gatekeeper checks the downloaded disk image, so submit that too and replace the
          # asset the action already uploaded.
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER" \
            --wait
          stapled=0
          for _ in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg"; then
              stapled=1
              break
            fi
            sleep 20
          done
          [ "$stapled" -eq 1 ]
          xcrun stapler validate "$dmg"
          if [ "$PUBLISH" = "true" ]; then
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            gh release upload "v${version}" "$dmg" --clobber
          fi
