name: Plugins

# Publishes the optional plugins that are too big to ship inside the app. For each plugin version
# that has no release yet, the workflow builds the plugin, zips and signs it with the updater key,
# and attaches both files to a pre-release named plugin-<id>-<version> (the id and the version in
# plugins/<id>/plugin.json). The app downloads from there when the plugin is turned on
# (archiveUrl in src/state/plugins.ts) and installs only what the signature vouches for.
#
# It runs when a plugin.json changes on main (a merged Sync plugins pull request, say), so a new
# version is published by merging it. Pushing a tag like plugin-excalidraw-0.18.1-1 publishes that
# one version, as before.
#
# Pre-release, so it never becomes the "latest" release the app's updater reads.
on:
  push:
    tags: ['plugin-*']
    branches: [main]
    paths: ['plugins/*/plugin.json']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes with git; keep the token away from npm install scripts.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Which plugins
        id: plugins
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          versionOf() { node -p "require('./plugins/$1/plugin.json').version"; }
          list=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            rest="${GITHUB_REF_NAME#plugin-}"
            for dir in plugins/*/; do
              id="$(basename "$dir")"
              if [[ "$rest" == "$id-"* ]]; then
                version="$(versionOf "$id")"
                if [ "$rest" != "$id-$version" ]; then
                  echo "Tag $GITHUB_REF_NAME doesn't match plugins/$id/plugin.json ($version)" >&2
                  exit 1
                fi
                list="$id"
              fi
            done
            if [ -z "$list" ]; then
              echo "No plugin for tag $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            # Downloaded plugins (not bundled with the app, not the template) without a release yet.
            for dir in plugins/*/; do
              id="$(basename "$dir")"
              [ -f "$dir/plugin.json" ] && [ "$id" != template ] || continue
              [ "$(node -p "!!require('./$dir/plugin.json').bundled")" = false ] || continue
              gh release view "plugin-$id-$(versionOf "$id")" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || list="$list $id"
            done
          fi
          echo "Publishing:${list:- nothing}"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      # Three steps, so the build (and the packages it runs) never sees the signing key or the token.
      - name: Build
        if: steps.plugins.outputs.list != ''
        env:
          LIST: ${{ steps.plugins.outputs.list }}
        run: for id in $LIST; do npx vite build --config "plugins/$id/vite.config.ts"; done
      - name: Zip and sign
        if: steps.plugins.outputs.list != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LIST: ${{ steps.plugins.outputs.list }}
        run: for id in $LIST; do node scripts/pack-plugin.mjs "$id"; done
      - name: Publish
        if: steps.plugins.outputs.list != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIST: ${{ steps.plugins.outputs.list }}
        run: |
          set -euo pipefail
          for id in $LIST; do
            version="$(node -p "require('./plugins/$id/plugin.json').version")"
            # On a tag the release takes that tag; on main it tags this commit.
            gh release create "plugin-$id-$version" "release/$id-$version.zip" "release/$id-$version.zip.sig" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "Plugin: $id $version" \
              --notes "Optional plugin for Workspace. Turn it on in Settings › Plugins; Workspace downloads these files and checks their signature. You don't need to download them yourself."
          done
