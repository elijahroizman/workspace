[package]
name = "workspace"
version = "0.1.0"
description = "A fast, tabbed editor for Word, PowerPoint, PDF and Markdown files"
edition = "2021"

[lib]
name = "workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Small blocking HTTP client for fetching video thumbnails; native TLS uses the macOS keychain roots.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString", "NSObject"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
