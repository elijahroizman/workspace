[package]
name = "workspace"
version = "0.8.0"
description = "A fast, tabbed editor for Word, PowerPoint, PDF and Markdown files"
edition = "2021"

[lib]
name = "workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Native TLS like ureq above: the system trust store, and no ring/rustls to build.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Small blocking HTTP client for fetching video thumbnails; native TLS uses the macOS keychain roots.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Plugin downloads: unpack the archive and check its signature against the updater key.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
minisign-verify = "0.3"
base64 = "0.22"
# Checks the MiKTeX installer against the checksum MiKTeX publishes (it isn't code-signed).
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString", "NSObject"] }

# Turns off WebView2's browser shortcuts (Ctrl+R reload, Ctrl+F find bar…). Same versions wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Registers Workspace's file types with Windows' Default Apps settings.
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
