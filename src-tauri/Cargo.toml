[package]
name = "workspace"
version = "0.10.4"
description = "A fast, tabbed editor for Word, PowerPoint, PDF and Markdown files"
edition = "2021"

[lib]
name = "workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Native TLS like ureq above: the system trust store, and no ring/rustls to build.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Small blocking HTTP client for fetching video thumbnails; native TLS uses the macOS keychain roots.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Plugin downloads: unpack the archive and check its signature against the updater key.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
minisign-verify = "0.3"
base64 = "0.22"
# Checks the MiKTeX installer against the checksum MiKTeX publishes (it isn't code-signed).
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString", "NSObject", "NSArray", "NSURL", "NSEnumerator", "NSData"] }
# ⌘O's panel, which picks files or a folder.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "NSImage"] }

# A second launch (`writan notes.md`, a double-click) hands its files to the running copy.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Turns off WebView2's browser shortcuts (Ctrl+R reload, Ctrl+F find bar…). Same versions wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Registers Writan's file types with Windows' Default Apps settings.
windows-registry = "0.6"
# The open dialog's "Open folder" button, and title and menu bars in the app's colors.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# ⌘O's dialog, with an Open Folder button.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Thin LTO and the default codegen units: a few minutes off each CI build, for a slightly bigger
# binary. Full LTO with codegen-units = 1 is smallest, if size ever matters more than build time.
[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
