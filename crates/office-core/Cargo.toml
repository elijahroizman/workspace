[package]
name = "office-core"
description = "The shared core of the office compiler: Word, PowerPoint, Excel and CSV in one model"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# The officec command line (src/bin/officec.rs).
cli = ["dep:serde_json"]

[dependencies]
quick-xml.workspace = true
zip.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }

[[bin]]
name = "officec"
required-features = ["cli"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
